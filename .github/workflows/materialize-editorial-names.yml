name: Materialize author-prepared names and roadmap

on:
  push:
    branches: [editorial/readable-names-and-roadmap-20261108]
    paths: [.github/workflows/materialize-editorial-names.yml]

permissions:
  contents: write

concurrency:
  group: editorial-readable-names-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Arcanada-one/knowledge-contract' && github.ref == 'refs/heads/editorial/readable-names-and-roadmap-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editorial/readable-names-and-roadmap-20261108
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact final punctuation refinement and verify content
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/editorial/readable-names-and-roadmap-20261108 | cut -f1)" = "$EXPECTED_HEAD"
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          previous = '548abd01d089faf81570efaafd41ef873c693e47'
          p = Path('tools/apply_document_names.py')
          expected = subprocess.check_output(['git', 'show', previous + ':' + str(p)])
          if p.read_bytes() != expected:
              raise SystemExit('Unexpected materializer bytes')
          text = expected.decode('utf-8')
          before = "    subtitle = subtitle[0].upper() + subtitle[1:]"
          after = "    if subtitle != explanation and subtitle.count(',') == 1 and ', and ' in subtitle:\n        subtitle = subtitle.replace(', and ', ' and ', 1)\n" + before
          if text.count(before) != 1:
              raise SystemExit('Punctuation insertion point changed')
          text = text.replace(before, after, 1)
          before = "git('show', 'd10ba0500be8c0ad2f031445df9c539b5e41fe54:' + path), text)"
          after = "git('show', 'd10ba0500be8c0ad2f031445df9c539b5e41fe54:' + path), git('show', '" + previous + ":' + path), text)"
          if text.count(before) != 1:
              raise SystemExit('Expected source guard changed')
          p.write_text(text.replace(before, after, 1), encoding='utf-8', newline='\n')
          p = Path('tools/test_document_names.py')
          text = p.read_text(encoding='utf-8')
          before = "'Knowledge Revision: Version Identity, and the Adoption of Norms'"
          if text.count(before) != 1:
              raise SystemExit('Expected title test changed')
          p.write_text(text.replace(before, "'Knowledge Revision: Version Identity and the Adoption of Norms'", 1), encoding='utf-8', newline='\n')
          PY
          python3 -B -m unittest tools.test_document_names -v
          python3 -B tools/apply_document_names.py --apply
          python3 -B tools/apply_document_names.py --check
          python3 -B tools/check_document_names.py .
          git diff --exit-code -- .github/workflows/ci.yml
      - name: Commit only content and verification outputs
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          from tools.apply_document_names import build
          outputs, _ = build()
          allowed = set(outputs) | {'tools/apply_document_names.py', 'tools/test_document_names.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if not (changed | untracked) <= allowed:
              raise SystemExit('Unexpected file changes; refusing push')
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'Polish shortened explanatory titles and retain source identity' -m 'Deterministic author-prepared punctuation refinement, no scientific-body changes. No main merge, deployment, index or task operation. Ordinary CI remains unchanged.'
          git push origin HEAD:refs/heads/editorial/readable-names-and-roadmap-20261108
          git rev-parse HEAD
