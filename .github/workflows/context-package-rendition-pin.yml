name: Rendition source and structure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  context-package-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact source pin, legacy anchors and 20 requirement identities
        run: python3 -B -m unittest tools.test_context_package_translation_pin -v
      - name: Read the pinned site rendition checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arcanada-one/contract-place-site
          ref: d3d17929f209612669f38db6a735d46bc9ec309c
          path: _rendition-site-checker
          persist-credentials: false
      - name: Install the tested Markdown renderer
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --location \
            --output "$RUNNER_TEMP/pandoc-3.1.3-1-amd64.deb" \
            https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          echo "caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  $RUNNER_TEMP/pandoc-3.1.3-1-amd64.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc-3.1.3-1-amd64.deb"
          test "$(pandoc --version | head -1)" = "pandoc 3.1.3"
      - name: Check both Context Controls bodies and all fifteen adverse controls
        run: |
          set -euo pipefail
          python3 -B reviews/renditions/context-controls-20261116/producer_validate.py \
            --repository . --site-repository _rendition-site-checker --pandoc pandoc
      - name: Check both Source Rule Checks bodies and all fifteen adverse controls
        run: |
          set -euo pipefail
          python3 -B reviews/renditions/source-rule-checks-20261116/producer_validate.py \
            --repository . --site-repository _rendition-site-checker --pandoc pandoc
      - name: Check both Agent Situation bodies and all fifteen adverse controls
        run: |
          set -euo pipefail
          python3 -B reviews/renditions/agent-situation-20261116/producer_validate.py \
            --repository . --site-repository _rendition-site-checker --pandoc pandoc
      - name: Replay historical c135 metadata and pin controls at b00
        run: |
          set -euo pipefail
          kc_c135_revision=b00b42fb5ca4f32ca443812c980c13d4d5d53d81
          kc_c135_worktree="$RUNNER_TEMP/kc-c135-baseline"
          git fetch --no-tags origin "$kc_c135_revision"
          git worktree add --detach "$kc_c135_worktree" "$kc_c135_revision"
          trap 'git worktree remove "$kc_c135_worktree"' EXIT
          python3 -B \
            "$kc_c135_worktree/reviews/renditions/agent-situation-20261116/check_catalogue_metadata.py" \
            --repository "$kc_c135_worktree" \
            --site-repository "$GITHUB_WORKSPACE/_rendition-site-checker"
          python3 -I -B reviews/renditions/source-currency-20261116/check_historical_pin_regression.py \
            --repository "$kc_c135_worktree" \
            --site-repository "$GITHUB_WORKSPACE/_rendition-site-checker"
      - name: Replay the historical 68-body source and roadmap checks at their exact input
        run: |
          set -euo pipefail
          kc_68_revision=18684f073285a4fa20f299518bd8a3d75b0c76d6
          kc_68_worktree="$RUNNER_TEMP/kc-68-body-baseline"
          git fetch --no-tags origin "$kc_68_revision"
          git worktree add --detach "$kc_68_worktree" "$kc_68_revision"
          trap 'git worktree remove "$kc_68_worktree"' EXIT
          python3 -I -B "$kc_68_worktree/tools/check_translation_roadmap_currency.py" \
            --root "$kc_68_worktree" --self-test
          python3 -I -B "$kc_68_worktree/reviews/renditions/source-currency-20261116/check_source_currency.py" \
            --repository "$kc_68_worktree" \
            --site-repository "$GITHUB_WORKSPACE/_rendition-site-checker" --pandoc pandoc
      - name: Compile all 72 bodies and check the four complete semantic specifications
        run: |
          set -euo pipefail
          python3 -I -B reviews/renditions/semantic-specifications-20261117/check_complete_renditions.py \
            --repository . --site-repository _rendition-site-checker --pandoc pandoc \
            --check-retained-result
      - name: Reject optimized Python for the assertion-based pinned consumer
        run: |
          set -euo pipefail
          set +e
          python3 -I -O -B reviews/renditions/semantic-specifications-20261117/check_complete_renditions.py \
            --repository . --site-repository _rendition-site-checker --pandoc pandoc \
            > "$RUNNER_TEMP/source-currency-optimized.log" 2>&1
          kc_currency_optimized_status=$?
          set -e
          cat "$RUNNER_TEMP/source-currency-optimized.log"
          test "$kc_currency_optimized_status" -eq 2
          python3 -B -c "from pathlib import Path; import sys; sys.exit(0 if 'optimized Python is unsupported' in Path(sys.argv[1]).read_text() else 1)" \
            "$RUNNER_TEMP/source-currency-optimized.log"
