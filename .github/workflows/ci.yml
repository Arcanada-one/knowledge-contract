name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate-export:
    name: candidate-export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, verified digest)
        # The exporter refuses without gitleaks, so the real-rows positive control needs it on the runner.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Check fail-closed export boundaries without network or index writes
        run: python3 -B -m unittest tools.test_export_corpus -v
      - name: Exercise exact-main candidate export without index writes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)/candidate"
          python3 -B tools/export_corpus.py --output "$out"
          python3 - "$out/manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          assert manifest['schema'] == 'KnowledgeContractCandidateExport/v2'
          assert manifest['scrutator_projection'] == 'not_applied'
          assert manifest['kc2_runtime_admission'] == 'not_measured'
          print('CANDIDATE_EXPORT_READBACK_PASS rows=' + str(manifest['row_count']))
          PY
  corpus-map:
    name: corpus-map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch retained corpus-map source outside branch history
        # Full branch history does not include this immutable F01 source pin.
        run: git fetch --no-tags origin 61d674244f70002e20506b387b210fd584074ad2
      - name: Translation coverage reporter unit tests (source-pinned, read-only)
        run: python3 -B -m unittest tools.test_report_translation_coverage -v
      - name: Corpus map validator controls
        run: python3 -B -m unittest tools.test_verify_corpus_map -v
      - name: Corpus map projection controls (RM-01 G0-G2 candidate)
        run: python3 -B -m unittest tools.test_project_corpus_map -v
      - name: Published corpus map and its pinned source objects
        run: python3 -B tools/verify_corpus_map.py --repo .
      - name: Deterministic candidate projection of pinned corpus map a7b2fb8c
        run: |
          python3 -B tools/project_corpus_map.py \
            --map reference/foundations/corpus-map.json \
            --expect-blob a7b2fb8cde305b8fe4145df1ee7d7179478fdd60 \
            --out-dir reference/foundations/projections/corpus-map-a7b2fb8c \
            --check
      - name: Reproducibility pin for corpus-map projection a7b2fb8c
        # Any input or generator blob change, or output digest drift, must fail here.
        run: |
          python3 -B - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          pin_path = Path('reference/foundations/projections/corpus-map-a7b2fb8c/REPRODUCIBILITY.json')
          pin = json.loads(pin_path.read_text(encoding='utf-8'))
          out = Path('reference/foundations/projections/corpus-map-a7b2fb8c')
          map_blob = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD:reference/foundations/corpus-map.json'], text=True
          ).strip()
          gen_blob = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD:tools/project_corpus_map.py'], text=True
          ).strip()
          errors = []
          if map_blob != pin['input']['git_blob']:
              errors.append(f"input blob {map_blob} != pin {pin['input']['git_blob']}")
          if gen_blob != pin['generator']['git_blob']:
              errors.append(f"generator blob {gen_blob} != pin {pin['generator']['git_blob']}")
          for name, expected in sorted(pin['outputs_sha256'].items()):
              actual = hashlib.sha256((out / name).read_bytes()).hexdigest()
              if actual != expected:
                  errors.append(f"{name}: {actual} != {expected}")
          if errors:
              print('REPRODUCIBILITY_PIN_MISMATCH')
              print('\n'.join(errors))
              sys.exit(1)
          print('REPRODUCIBILITY_PIN_OK')
          print(json.dumps({
              'input_blob': map_blob,
              'generator_blob': gen_blob,
              'outputs_sha256': pin['outputs_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - name: Inventory-first /2 candidate (KC-MAP2-1)
        run: |
          python3 -B -m unittest tools.test_corpus_map_v2_inventory -v
          python3 -B tools/build_corpus_map_v2_inventory.py --check
          python3 -B tools/verify_corpus_map.py --map reviews/corpus-map-v2/corpus-map-v2.inventory-candidate.json --repo .
      - name: Negative control (an unpinned source must fail the validator)
        # Exit 1 is a structural refusal; exit 0 or an input error (2) means the step proves nothing.
        run: |
          python3 -B - "$RUNNER_TEMP/unpinned-map.json" <<'PY'
          import json, sys
          d = json.load(open('reference/foundations/corpus-map.json', encoding='utf-8'))
          next(iter(d['sources'].values()))['commit'] = 'main'
          json.dump(d, open(sys.argv[1], 'w', encoding='utf-8'))
          PY
          set +e
          python3 -B tools/verify_corpus_map.py --map "$RUNNER_TEMP/unpinned-map.json" > "$RUNNER_TEMP/unpinned.out"
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"structural_valid": false' "$RUNNER_TEMP/unpinned.out"

  book-package:
    name: book-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned schema validator
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bp-venv"
          "$RUNNER_TEMP/bp-venv/bin/pip" install --quiet jsonschema==4.23.0
      - name: Schema, positive and negative fixtures, cross-file mutations
        run: |
          set -euo pipefail
          cd tools
          "$RUNNER_TEMP/bp-venv/bin/python" -B -m unittest test_book_package test_build_book_package test_book_package_review test_contract_profile test_index_release_receipt test_pipeline_receipts test_document_classification test_private_retention_readback test_package_tree_verification test_kc_admission_observation -v
      - name: Valid fixture package passes the validator
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/check_book_package.py schemas/fixtures/book-package/valid/synthetic-rle-primer
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/check_book_package.py schemas/fixtures/book-package/valid/synthetic-public-domain-primer
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/check_pipeline_receipts.py schemas/fixtures/pipeline/valid/synthetic-chain
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/check_document_classification.py schemas/fixtures/document-classification/valid/12-unresolved-book-versus-report-evidence.json
      - name: Committed fixtures equal regenerated fixtures
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/book_package_fixture.py write
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/pipeline_fixture.py write
          "$RUNNER_TEMP/bp-venv/bin/python" -B tools/document_classification_fixture.py write
          git diff --exit-code -- schemas/fixtures

  publication-integrity:
    name: publication-integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Title-only projection reads the pinned accepted paper via git cat-file.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the publication parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          test "$(pandoc --version | head -1)" = "pandoc 3.1.3"
      - name: Publication metadata, navigation and evidence checks
        run: |
          python3 -B -m unittest tools.test_check_publication -v
          python3 -B tools/check_publication.py .
          python3 -B -m unittest tools.test_document_names -v
          python3 -B tools/check_document_names.py
          python3 -B tools/check_requirement_register.py
      - name: Recheck formal counterexamples and corrected finite models
        run: python3 -B -m unittest tools.test_reviewed_formal_results -v
      - name: Retrieval-context checker controls
        run: python3 -B -m unittest tools.test_verify_retrieval_context -v
      - name: Pin and run retrieval-context checker
        # Bounded author-side control. A missing report or non-zero exit is failure, never PASS.
        # Exact mode runs on a temp materialization of the pinned accepted blob (PAPER_SHA256 /
        # PROTECTED unchanged). Title-only compares the working-tree paper to that blob.
        env:
          CHECKER_SHA256: 012230524775c6c9322b2fc01bb3be469adc52135cb89df8c3c6bda68e80ebf2
          PAPER_SHA256: e457fadcb17424e15083504a2babb2646aedc8aec7370048cd77854a8c7af64f
          ACCEPTED_PAPER_BLOB: 9311c0d157d5a926e3c08f6a087a53866064f4e0
        run: |
          set -euo pipefail
          echo "${CHECKER_SHA256}  tools/verify_retrieval_context.py" | sha256sum -c -
          accepted="$RUNNER_TEMP/retrieval-context-accepted-PAPER.md"
          git cat-file -p "${ACCEPTED_PAPER_BLOB}" > "$accepted"
          echo "${PAPER_SHA256}  $accepted" | sha256sum -c -
          report="$RUNNER_TEMP/retrieval-context-report.json"
          python3 -B tools/verify_retrieval_context.py --paper "$accepted" > "$report"
          test -s "$report"
          python3 -B -m json.tool "$report"
          title_only="$RUNNER_TEMP/retrieval-context-title-only-report.json"
          python3 -B tools/verify_retrieval_context.py \
            --paper papers/retrieval-and-context-composition/PAPER.md \
            --title-only-against "${ACCEPTED_PAPER_BLOB}" \
            > "$title_only"
          test -s "$title_only"
          python3 -B -m json.tool "$title_only"
      - name: Reproduce public finite studies
        run: |
          python3 -B engineering/studies/dependency-closure-and-package-delivery/evidence/replay_closure.py
          python3 -B engineering/studies/source-transcription-and-uncertainty/evidence/replay_uncertainty_projection.py
          python3 -B engineering/studies/reuse-admission-and-cost-controls/evidence/replay_reuse_counterexamples.py
          python3 -B engineering/studies/editorial-skill-pilot/evidence/replay_editorial_checks.py
      - name: Check corrected study boundaries without rewriting historical evidence
        run: |
          python3 -B engineering/studies/dependency-closure-and-package-delivery/checks/check_closure_size_and_mutations.py
          python3 -B engineering/studies/source-transcription-and-uncertainty/checks/demonstrate_uncertainty_projection.py
          python3 -B engineering/studies/reuse-admission-and-cost-controls/checks/check_admission_and_cost.py
      - name: Recheck agent situation controls in an isolated study copy
        run: |
          set -euo pipefail
          kc_situation_tmp="$(mktemp -d)"
          mkdir -p "$kc_situation_tmp/engineering/studies"
          cp -R engineering/studies/agent-situation-controls "$kc_situation_tmp/engineering/studies/"
          cd "$kc_situation_tmp"
          python3 -B engineering/studies/agent-situation-controls/checks/check_agent_situation.py --evidence "$kc_situation_tmp/finite-run.json"

  licensing:
    name: licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No fork filter and no secrets on this job or on `dco`: fork PRs must run both, because a skipped required check counts as passed.
      - name: Source register, DCO and workflow tests
        run: python3 -B -m unittest tools.test_check_sources tools.test_check_dco tools.test_ci_workflow tools.test_check_separation -v
      - name: Cross-package overlay preparation corpus (G11)
        # Bounded producer-side preparation for tools/cross_package_overlay.py.
        # A missing JSON report or non-zero refusal exit is failure for positives;
        # typed refusals must stay non-zero.
        run: python3 -B -m unittest tools.test_cross_package_overlay -v
      - name: Assessed-coverage finite oracle corpus (Layer S)
        # Network-free S01–S22 oracle for tools/assessed_coverage_oracle.py.
        # effects_authorized stays false; Layer N (N01–N06) is NOT_MEASURED.
        run: python3 -B -m unittest tools.test_assessed_coverage_oracle -v
      - name: RM-04 workgraph reconcile harness (synthetic dry-run)
        # Isolated replay for tools/reconcile_workgraph.py against synthetic snapshots.
        # No Muneral/network calls; disagreements exit non-zero with typed codes.
        run: python3 -B -m unittest tools.test_reconcile_workgraph -v
      - name: Every publication and evidence file declares its sources
        run: python3 -B tools/check_sources.py .
      - name: REUSE lint
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --quiet reuse==6.2.0
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every PR commit has a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B tools/check_dco.py "$BASE_SHA" "$HEAD_SHA"

  decision-separation:
    name: decision-separation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decision or table files and content paths never share a pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B tools/check_separation.py "$BASE_SHA" "$HEAD_SHA"

  markdown-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 '**/*.md'

  link-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
          failIfEmpty: true

  security-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: Arcanada-one/datarim/.github/workflows/reusable-security-audit.yml@5a204199acd5b708ea63d99f6d642848f532bead
    with:
      stack: framework
      datarim_ref: 5a204199acd5b708ea63d99f6d642848f532bead
      runner_labels: '["ubuntu-latest"]'

  cases:
    name: cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every number in a case resolves to a receipt in this repository
        run: |
          set -euo pipefail
          (cd tools && python3 -B -m unittest test_cases -v)
          python3 -B tools/check_cases.py
