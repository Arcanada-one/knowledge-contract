version = 1
SPDX-PackageName = "Knowledge Contract Arcana"
SPDX-PackageSupplier = "Pavel Valentov"
SPDX-PackageDownloadLocation = "https://github.com/Arcanada-one/knowledge-contract"

# Default: text, documentation, papers, specifications, corpus data.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pavel Valentov and Knowledge Contract Arcana contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Code, schemas, tools, CI and configuration.
[[annotations]]
path = ["tools/**", "schemas/**", "engineering/studies/**/*.py", "engineering/studies/contract-profile-conformance/historical-recovery/contract-synthesis-0.1.schema.json", "appendices/**/*.schema.json", ".github/**", "reviews/semantic-bridge-20261114/non-author/*.py", ".gitignore", ".gitattributes", ".markdownlint.json", "REUSE.toml", "CITATION.cff"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Pavel Valentov and Knowledge Contract Arcana contributors"
SPDX-License-Identifier = "Apache-2.0"

# Root LICENSE and LICENSE-CODE are the unmodified official texts; REUSE ignores LICENSE* files.
